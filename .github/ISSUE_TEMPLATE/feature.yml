name: Feature Request
description: Request a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion.

  - type: textarea
    id: feature
    attributes:
      label: New feature
      description: Describe the feature or improvement you'd like to see.
      placeholder: Describe your idea...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: Explain the problem...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this could be implemented?
      placeholder: Describe your proposed solution...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context (optional)
      description: Add any additional information that may help explain your request.
