name: Bug Report
description: Create a report to help RTBNext improve.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Scroll to ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Endpoint, error message, screenshots or anything else that may help.
